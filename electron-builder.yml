appId: com.hocyapp.thachmay
productName: Thach may hoc Y gioi hon tao
npmRebuild: false
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/tessdata
    to: tessdata
  - from: resources/scripts
    to: scripts
  - from: resources/paddleocr/PaddleOCR-json_v1.4.1
    to: paddleocr
asarUnpack:
  - '**/*.node'
win:
  icon: resources/icon.ico
  target:
    - target: dir
      arch:
        - x64
